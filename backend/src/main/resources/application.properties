spring.application.name=worsi-backend
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/worksy}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Multipart uploads (booking photos): 5 MB per file, up to 5 files + the JSON part
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB

# Booking photo limits (also enforced in BookingImageValidator)
app.booking.images.max-count=5
app.booking.images.max-bytes=5242880

# Profile picture (Edit Profile): max size in bytes (2 MB). JPEG/PNG/WEBP only, checked by magic bytes.
app.profile.avatar.max-bytes=${PROFILE_AVATAR_MAX_BYTES:2097152}

# Image storage: local disk. MUST point at a persistent volume in production (see UPLOAD_DIR)
app.storage.local.dir=${UPLOAD_DIR:./uploads}

# JWT
app.jwt.secret=${JWT_SECRET}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Google OAuth
app.oauth.google.client-id=918448887306-hi6h0phgpefv2iv3r3d64gf61vdhf8tn.apps.googleusercontent.com


# Phone OTP
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
app.otp.max-requests-per-window=${OTP_MAX_REQUESTS_PER_WINDOW:5}
app.otp.request-window-minutes=${OTP_REQUEST_WINDOW_MINUTES:15}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:30}
app.otp.max-verify-attempts=${OTP_MAX_VERIFY_ATTEMPTS:5}

# SMS Provider
app.sms.provider=${SMS_PROVIDER:console}

# Forgot Password / Reset Password
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:3000}
app.password-reset.expiry-minutes=${PASSWORD_RESET_EXPIRY_MINUTES:30}
app.password-reset.cooldown-seconds=${PASSWORD_RESET_COOLDOWN_SECONDS:60}
app.password-reset.max-requests-per-window=${PASSWORD_RESET_MAX_REQUESTS_PER_WINDOW:3}
app.password-reset.request-window-minutes=${PASSWORD_RESET_REQUEST_WINDOW_MINUTES:60}

# Gmail SMTP
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.ssl.checkserveridentity=false
# Email Provider
app.mail.provider=${MAIL_PROVIDER:smtp}

# Email Sender
app.mail.from=${MAIL_FROM}

# Platform commission taken from completed jobs (fraction: 0.10 = 10%). Used for provider earnings.
app.commission.rate=${PLATFORM_COMMISSION_RATE:0.10}

# Provider-set service prices: highest price a provider may enter (guards against typos)
app.pricing.max-price=${MAX_SERVICE_PRICE:100000}

# Nearby provider search
app.nearby.default-radius-km=${NEARBY_DEFAULT_RADIUS_KM:10}
app.nearby.max-radius-km=${NEARBY_MAX_RADIUS_KM:50}

# Geocoding (typed location -> coordinates). Backend-only; OpenStreetMap Nominatim by default.
# Public Nominatim policy: max 1 request/second, identifying User-Agent, cache results, no keystroke autocomplete.
# For heavy production traffic point GEOCODING_BASE_URL at a paid or self-hosted Nominatim instead.
app.geocoding.base-url=${GEOCODING_BASE_URL:https://nominatim.openstreetmap.org}
app.geocoding.user-agent=${GEOCODING_USER_AGENT:Worksy/1.0}
app.geocoding.contact-email=${GEOCODING_CONTACT_EMAIL:}
app.geocoding.country-codes=${GEOCODING_COUNTRY_CODES:in}
app.geocoding.timeout-ms=${GEOCODING_TIMEOUT_MS:5000}
app.geocoding.min-interval-ms=${GEOCODING_MIN_INTERVAL_MS:1100}
app.geocoding.cache-ttl-minutes=${GEOCODING_CACHE_TTL_MINUTES:1440}
app.geocoding.max-results=${GEOCODING_MAX_RESULTS:5}
