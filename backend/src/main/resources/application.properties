spring.application.name=worsi-backend
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/worksy}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
# Schema is now owned by Flyway (see src/main/resources/db/migration). Hibernate only verifies
# the entities match what Flyway created - it must never auto-alter the schema again, since that
# is what silently corrupted the users table before (see V1 migration for the fix/backfill).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Flyway: this database already has tables (created previously by ddl-auto=update) but no Flyway
# history, so baseline it at "before V1" and let V1 bring it the rest of the way, safely.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JWT signing key (>= 32 chars). OVERRIDE with the JWT_SECRET env var outside local development.
app.jwt.secret=${JWT_SECRET:worsi-dev-only-secret-key-change-me-0123456789}

# Comma-separated list of browser origins allowed to call the API
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- Sign in with Google ---
# The OAuth 2.0 Client ID of your Google app (Google Cloud Console > APIs & Services >
# Credentials). This is the ONLY Google credential this backend needs: the frontend uses Google
# Identity Services to get an ID token directly, and the backend just verifies it, so
# GOOGLE_CLIENT_SECRET / GOOGLE_REDIRECT_URI are not required by the flow implemented here. Add
# them later only if you introduce a server-side authorization-code exchange.
app.oauth.google.client-id=${GOOGLE_CLIENT_ID:}

# --- Phone OTP login ---
app.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
app.otp.max-requests-per-window=${OTP_MAX_REQUESTS_PER_WINDOW:5}
app.otp.request-window-minutes=${OTP_REQUEST_WINDOW_MINUTES:15}
app.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:30}
app.otp.max-verify-attempts=${OTP_MAX_VERIFY_ATTEMPTS:5}

# Which SmsSender bean is active. "console" (default) just logs the OTP for local development -
# it must never be used in production. Wire a real provider by adding a new SmsSender
# implementation and pointing this at it (see service/sms/SmsSender.java).
app.sms.provider=${SMS_PROVIDER:console}
